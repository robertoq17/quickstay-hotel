spring:
  application:
    name: quickstay-payment-service

  datasource:
    url: jdbc:postgresql://${PAYMENT_DB_HOST:127.0.0.1}:${PAYMENT_DB_PORT:5434}/${PAYMENT_DB_NAME:quickstay_payment}
    username: ${PAYMENT_DB_USER:quickstay_payment}
    password: ${PAYMENT_DB_PASSWORD:quickstay_payment}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PAYMENT_SERVICE_PORT:8081}

logging:
  level:
    com.quickstay.payment: DEBUG
