spring:
  application:
    name: quickstay-backend

  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/quickstay
    username: quickstay
    password: quickstay

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: quickstay
    password: quickstay

server:
  port: 8080

logging:
  level:
    com.quickstay: DEBUG