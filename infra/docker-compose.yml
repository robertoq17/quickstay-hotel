services:
  postgres:
    image: postgres:16
    container_name: quickstay-postgres
    environment:
      POSTGRES_DB: quickstay
      POSTGRES_USER: quickstay
      POSTGRES_PASSWORD: quickstay
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
volumes:
  pgdata:
